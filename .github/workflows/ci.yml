name: CI

# PRs produce checked preview packages. Main produces the next release after all checks.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump on main
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      release_version:
        description: Optional explicit SemVer on main, e.g. 0.1.0 or 0.2.0-rc.1
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release-tooling:
    name: Release tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python -B -m unittest discover -s tests/release -v
      - run: node --test tests/gnome/bridge.test.mjs

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx
      - run: dotnet restore Typlo.slnx
      - run: dotnet build Typlo.slnx -c Release --no-restore
      - run: dotnet test Typlo.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Windows WebView2 editor integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-webview.ps1 -ResultsDirectory TestResults/webview2 -InstallRuntimeIfMissing
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}
          path: |
            TestResults/*.trx
            TestResults/webview2/*.txt
            TestResults/webview2/typlo.log
            TestResults/webview2/runtime/*.txt
          if-no-files-found: warn
          retention-days: 7

  linux-selftest:
    name: Linux X11 clipboard and hotkey selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx
      - run: dotnet publish src/Typlo.App -c Release -r linux-x64 --self-contained true -o dist/ci-linux-publish
      - run: docker build -t typlo-selftest tests/linux
      - name: Test in a disposable X11 session
        run: |
          mkdir -p dist/selftest
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/dist/ci-linux-publish,target=/app,readonly" \
            --mount "type=bind,source=$PWD/dist/selftest,target=/out" typlo-selftest
      - name: Retain selftest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x11-selftest
          path: dist/selftest
          if-no-files-found: warn
          retention-days: 7

  gnome-selftest:
    name: GNOME 46 X11 five-source switching
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: docker build -t typlo-gnome-selftest -f tests/gnome/Dockerfile .
      - run: docker run --rm --network none typlo-gnome-selftest

  version:
    name: Select release or preview version
    needs: [release-tooling, build-and-test, linux-selftest, gnome-selftest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; }; then
            python scripts/release.py version
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-pr.${PR_NUMBER:-$GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  verify-packages:
    name: Verify downloaded release packages
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Typlo-*
          path: dist/packages
          merge-multiple: true
      - name: Check all five archive/checksum pairs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release.py verify --directory dist/packages --version "$VERSION" --commit "$GITHUB_SHA"

  release:
    name: Publish release from main
    needs: [release-tooling, build-and-test, linux-selftest, gnome-selftest, version, packages, verify-packages]
    if: >-
      github.repository == 'bitcodepro/Typlo' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Typlo-*
          path: dist/packages
          merge-multiple: true
      - name: Verify packages, reserve immutable tag, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release.py publish --directory dist/packages --version "$VERSION"
