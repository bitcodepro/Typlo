name: Windows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

env:
  CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
  RUSTFLAGS: -C target-feature=+crt-static
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preview the versioned release checkout (no remote writes)
        shell: pwsh
        run: ./tools/plan-windows-release.ps1 -Preview
      - uses: ./.release-ci-action
      - name: Record verified preview inputs
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/release-controller/finish-windows-release.ps1"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-preview-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: windows-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find oldest unfinished source through this event SHA
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/plan-windows-release.ps1
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.plan.outputs.pending == 'true'
        id: candidate
        with:
          path: ${{ runner.temp }}/release-candidate
          key: windows-release-bytes-v1-${{ steps.plan.outputs.commit }}
      - name: Refuse rebuilding an existing draft without its original bytes
        if: steps.plan.outputs.owned_draft == 'true' && steps.candidate.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw 'Original candidate cache unavailable. Recover the original verified artifact before retrying; draft assets will not be replaced.'
      - uses: ./.release-ci-action
        if: steps.plan.outputs.pending == 'true' && steps.candidate.outputs.cache-hit != 'true'
      - name: Validate canonical bytes and inputs
        if: steps.plan.outputs.pending == 'true'
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/release-controller/finish-windows-release.ps1"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.plan.outputs.pending == 'true'
        with:
          name: windows-release-${{ steps.plan.outputs.commit }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.plan.outputs.pending == 'true' && steps.candidate.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/release-candidate
          key: windows-release-bytes-v1-${{ steps.plan.outputs.commit }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.plan.outputs.pending == 'true'
        id: persisted
        with:
          path: ${{ runner.temp }}/release-candidate
          key: windows-release-bytes-v1-${{ steps.plan.outputs.commit }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Export tested commit and publish verified draft by ID
        if: steps.plan.outputs.pending == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PERSISTED: ${{ steps.persisted.outputs.cache-hit }}
        run: |
          if ($env:CANDIDATE_PERSISTED -cne 'true') { throw 'Canonical retry bytes not persisted; refusing writes' }
          & "$env:RUNNER_TEMP/release-controller/finish-windows-release.ps1" -Phase Publish
