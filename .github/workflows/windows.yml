name: Windows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'rustup toolchain setup failed' }
          $version = rustc -V
          if ($LASTEXITCODE -ne 0) { throw 'rustc failed' }
          "RUST_CACHE_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x64-static-${{ env.RUST_CACHE_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - name: Test
        shell: pwsh
        run: |
          cargo test --locked --all-features
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
      - name: Clippy
        shell: pwsh
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed' }
      - name: Release build
        shell: pwsh
        run: |
          cargo build --release --locked --features gui --bins
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
      - name: Release tooling tests
        shell: pwsh
        run: ./tools/test-release-tools.ps1
      - name: Package one Windows ZIP and verify
        shell: pwsh
        run: ./tools/prepare-windows-release.ps1 -SoftwareOpenGL
      - name: Verify ZIP with published v0.1.0 updater
        shell: pwsh
        run: ./tools/test-windows-package-compat.ps1 -ArchivePath ./dist/typlo-rust-win-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    concurrency:
      group: windows-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-${{ github.sha }}
          path: dist
      - name: Verify assets and publish draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-windows-release.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA
